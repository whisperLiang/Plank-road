# Real baseline experiment configuration.

experiment:
  method: plank_road_multi_device
  num_devices: 1
  total_frames: 128
  results_dir: results/baselines_real_smoke
  video_path: ./video_data/road.mp4
  student_model: yolo26
  teacher_model: ./cache/teacher_labels/road
  initial_checkpoint:
  seed: 2026
  repeat_id: 0
  run_id: baselines_real_smoke
  method_variant: default
  window_seconds: 10
  window_frames:
  batch_size: 2
  epochs: 1
  device: cpu
  bandwidth_mbps: 50
  max_concurrent_train_jobs: 1
  real_sleep_upload: false
  reuse_teacher_cache: true
  quick_smoke: false
  f1_threshold:
  map50_threshold:
  recovery_sla_sec: 120
  latency_sla_ms:
  capacity_mode: false

baselines:
  plank_road_multi_device:
    upload_mode_default: raw_only
    allow_resource_aware_feature_upload: true
    collect_num: 20
    f1_trigger_threshold: 0.55
    enable_feature_cache: true
    enable_split_tail_training: true
    enable_resource_aware_trigger: true
    enable_feature_upload: true

  ekya_style_centralized_scheduling:
    inference_reserved_ratio: 0.6
    retraining_window_size: 32
    retraining_trigger_min_samples: 16
    queue_policy: thief
    retraining_steps_per_round: 3
    signal_threshold: 0.18
    microprofile_sample_fraction: 0.1

  accuracy_trigger_cloud_retraining:
    trigger_window_size: 32
    confidence_drop_threshold: 0.15
    low_conf_ratio_threshold: 0.30
    drift_ratio_threshold: 0.20
    low_quality_threshold: 0.50
    upload_mode: raw_only
    trigger_cooldown_windows: 1
    max_buffered_windows: 4
    max_selected_frames_per_window: 12

  pure_edge_local_updating:
    trigger_min_samples: 16
    low_conf_ratio_threshold: 0.30
    local_num_epoch: 1
    retrain_target: full_model
