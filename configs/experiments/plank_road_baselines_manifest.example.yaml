experiment_id: suwon5a_weather
log_timezone: Asia/Shanghai

methods:
  - plank_road
  - SURGEON
  - CATR
  - Ekya

student_model: rfdetr_nano
teacher_model: rtdetr_x

scenarios:
  - scenario_name: Rainy
    scenario_slug: rainy
    video_path: video_data/rainy.mp4
    frame_range: [0, 1999]
  - scenario_name: Snowy
    scenario_slug: snowy
    video_path: video_data/snowy.mp4
    frame_range: [0, 1999]

edge_counts: [1, 2, 4]
repeats: [1, 2, 3]
edge_ids_by_count:
  "1": [1]
  "2": [1, 2]
  "4": [1, 2, 3, 4]

metrics:
  accuracy_definition: teacher_supervised_f1
  accuracy_file: null
  ground_truth_file: null

notes:
  - Raw logs are resolved from the matrix; do not add explicit runs.
  - Different repeats must use different repeat values.
