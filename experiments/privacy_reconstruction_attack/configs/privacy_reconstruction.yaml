privacy_score_split_points:
  - name: split_score_0_8
    privacy_leakage_score: 0.8
    split_point: auto
  - name: split_score_0_6
    privacy_leakage_score: 0.6
    split_point: auto
  - name: split_score_0_4
    privacy_leakage_score: 0.4
    split_point: auto
  - name: split_score_0_2
    privacy_leakage_score: 0.2
    split_point: auto

split_resolution:
  max_candidates: 0
  validate_candidates: false
  require_unique: true

feature_distance:
  cosine_weight: 1.0
  nmse_weight: 1.0
  eps: 1.0e-8
  tensor_weights: {}

pixel_dra:
  enabled: true
  iterations: 800
  optimizer: Adam
  lr: 0.05
  init: random_noise
  image_range: [0.0, 1.0]
  tv_weight: 1.0e-4
  l2_weight: 1.0e-5
  range_weight: 1.0
  log_every: 100
  max_samples_per_split: 100

drag:
  enabled: true
  checkpoint: runwayml/stable-diffusion-v1-5
  image_size: 512
  attack_image_size: 224
  torch_dtype: float16
  num_inference_steps: 80
  num_internal_iterations: 4
  guidance_rate: 0.2
  strength: 1.0
  eta: 1.0
  max_grad_norm: 0.02
  l2_regularization_x: 0.01
  total_variation_x: 0.0
  max_samples_per_split: 10
  log_every_n_steps: 20

metrics:
  object_iou_threshold: 0.5
  psnr_norm_max: 40.0
  lpips_norm_max: 1.0
  teacher_threshold: null

