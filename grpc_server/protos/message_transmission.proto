syntax = "proto3";

service MessageTransmission {
  // Cloud-side continual learning: edge sends collected frame indices,
  // cloud retrains the lightweight model and returns updated weights.
  rpc train_model_request (TrainRequest) returns (TrainReply) {}
  // Versioned continual-learning bundle upload for the fixed-split pipeline.
  rpc continual_learning_request (ContinualLearningRequest) returns (ContinualLearningReply) {}
  // Sharded sample pool exchange without creating a training job.
  rpc sync_samples (SampleSyncRequest) returns (SampleSyncReply) {}
  // Async training job submission for edge-triggered continual learning.
  rpc submit_training_job (SubmitTrainingJobRequest) returns (SubmitTrainingJobReply) {}
  // Poll async training job status by job_id.
  rpc get_training_job_status (TrainingJobStatusRequest) returns (TrainingJobStatusReply) {}
  // Download trained model for a completed async training job.
  rpc download_trained_model (DownloadTrainedModelRequest) returns (DownloadTrainedModelReply) {}
  // Report that an edge has applied a model update.
  rpc report_edge_model_version (ReportEdgeModelVersionRequest) returns (ReportEdgeModelVersionReply) {}
  // Cancel a queued or running training job.
  rpc cancel_training_job (CancelTrainingJobRequest) returns (CancelTrainingJobReply) {}
  // Resource-aware CL trigger: edge queries cloud resource utilisation.
  rpc query_resource (ResourceRequest) returns (ResourceReply) {}
  // Bandwidth estimation: edge sends a small payload, cloud echoes it.
  rpc bandwidth_probe (BandwidthProbeRequest) returns (BandwidthProbeReply) {}
  // Distributed baseline deployment RPCs.
  rpc RegisterEdge (BaselineRegisterEdgeRequest) returns (BaselineAck) {}
  rpc Heartbeat (BaselineHeartbeatRequest) returns (BaselineAck) {}
  rpc UploadFrame (BaselineFrameRequest) returns (BaselineAck) {}
  rpc UploadKeyFrame (BaselineFrameRequest) returns (BaselineAck) {}
  rpc UploadAccuracyTriggerWindow (BaselineWindowRequest) returns (BaselineAck) {}
  rpc UploadPrediction (BaselineFrameRequest) returns (BaselineAck) {}
  rpc RequestCloudInference (BaselineInferenceRequest) returns (BaselineInferenceReply) {}
  rpc PollCommand (BaselineCommandRequest) returns (BaselineCommandReply) {}
  rpc DownloadInferenceResult (BaselineInferenceRequest) returns (BaselineInferenceReply) {}
  // Ekya-style cloud scheduling: edge streams JPEG frames and receives
  // cloud inference results in the same online stream.
  rpc EkyaFrameStream (stream EkyaClientMessage)
      returns (stream EkyaServerMessage) {}
  // Offline experiment artifact archival. This is not method communication.
  rpc UploadExperimentResult (UploadExperimentResultRequest)
      returns (UploadExperimentResultResponse) {}
}

enum TrainingJobType {
  TRAINING_JOB_TYPE_UNSPECIFIED = 0;
  TRAINING_JOB_TYPE_FULL_FRAME = 1;
  reserved 2;
  TRAINING_JOB_TYPE_CONTINUAL_LEARNING = 3;
  TRAINING_JOB_TYPE_BASELINE_TRAINING = 4;
}

// Continual learning messages
message TrainRequest {
  int64 edge_id = 1;
  repeated int64 frame_indices = 2;
  // Cloud-owned working directory hint; server resolves it inside workspace_root.
  string cache_path = 3;
  reserved 4;
  bytes payload_zip = 5;
}

message TrainReply {
  bool success = 1;
  // Base-64 encoded PyTorch state-dict bytes of the retrained lightweight model
  string model_data = 2;
  string message = 3;
}

message ContinualLearningRequest {
  string protocol_version = 1;
  int64 edge_id = 2;
  string cache_path = 3;
  reserved 4;
  bool send_low_conf_features = 5;
  bytes payload_zip = 6;
}

message ContinualLearningReply {
  bool success = 1;
  string model_data = 2;
  string message = 3;
  string protocol_version = 4;
}

message SampleSyncRequest {
  string protocol_version = 1;
  int64 edge_id = 2;
  string model_id = 3;
  string model_version = 4;
  string split_config_id = 5;
  string sync_type = 6;
  bytes payload_zip = 7;
}

message SampleSyncReply {
  bool success = 1;
  string message = 2;
  int64 committed_samples = 3;
}

message SubmitTrainingJobRequest {
  string protocol_version = 1;
  int64 edge_id = 2;
  string request_id = 3;
  TrainingJobType job_type = 4;
  string cache_path = 5;
  reserved 6;
  bool send_low_conf_features = 7;
  repeated int64 frame_indices = 8;
  reserved 9, 10;
  bytes payload_zip = 11;
  // Model version at the time of submission (for stale detection)
  string base_model_version = 12;
}

message SubmitTrainingJobReply {
  bool accepted = 1;
  string job_id = 2;
  string status = 3;
  int64 queue_position = 4;
  string message = 5;
}

message TrainingJobStatusRequest {
  int64 edge_id = 1;
  string job_id = 2;
}

message TrainingJobStatusReply {
  bool found = 1;
  string job_id = 2;
  int64 edge_id = 3;
  string status = 4;
  int64 queue_position = 5;
  string message = 6;
  string request_id = 7;
  TrainingJobType job_type = 8;
  bool result_available = 9;
  int64 submitted_at_ms = 10;
  int64 started_at_ms = 11;
  int64 finished_at_ms = 12;
  string protocol_version = 13;
  string base_model_version = 14;
  string result_model_version = 15;
  string worker_id = 16;
}

message DownloadTrainedModelRequest {
  int64 edge_id = 1;
  string job_id = 2;
}

message DownloadTrainedModelReply {
  bool success = 1;
  string job_id = 2;
  string status = 3;
  string model_data = 4;
  string message = 5;
  string protocol_version = 6;
  string result_model_version = 7;
}

message ReportEdgeModelVersionRequest {
  int64 edge_id = 1;
  string model_id = 2;
  string model_version = 3;
}

message ReportEdgeModelVersionReply {
  bool success = 1;
  string message = 2;
}

// Cancel a queued or running training job
message CancelTrainingJobRequest {
  int64 edge_id = 1;
  string job_id = 2;
}

message CancelTrainingJobReply {
  bool cancelled = 1;
  string message = 2;
}

// Resource-aware CL trigger: cloud resource query
message ResourceRequest {
  int64 edge_id = 1;
}

message ResourceReply {
  double cpu_utilization = 1;      // [0.0, 1.0]
  double gpu_utilization = 2;      // [0.0, 1.0]
  double memory_utilization = 3;   // [0.0, 1.0]
  int64 train_queue_size = 4;      // current training queue depth
  int64 max_queue_size = 5;        // max training queue capacity
}

// Bandwidth probe: edge sends payload, cloud echoes back
message BandwidthProbeRequest {
  string payload = 1;
}

message BandwidthProbeReply {
  string payload = 1;
}

message BaselineAck {
  bool success = 1;
  string message = 2;
}

message BaselineRegisterEdgeRequest {
  string run_id = 1;
  string baseline_method = 2;
  int64 edge_id = 3;
  string model_name = 4;
  string model_version = 5;
  string video_source = 6;
  int64 timestamp_ms = 7;
}

message BaselineHeartbeatRequest {
  string run_id = 1;
  string baseline_method = 2;
  int64 edge_id = 3;
  int64 timestamp_ms = 4;
  string metrics_ref = 5;
  string metrics_json = 6;
}

message BaselineFrameRequest {
  string run_id = 1;
  string baseline_method = 2;
  int64 edge_id = 3;
  int64 frame_id = 4;
  int64 timestamp_ms = 5;
  string model_name = 6;
  string model_version = 7;
  string video_source = 8;
  string upload_mode = 9;
  bool is_keyframe = 10;
  string edge_prediction_json = 11;
  string cloud_prediction_json = 12;
  string teacher_prediction_json = 13;
  double confidence = 14;
  double entropy = 15;
  string quality_metadata_json = 16;
  bytes raw_frame = 17;
  string raw_frame_ref = 18;
  string feature_ref_json = 19;
  string metrics_ref = 20;
  string job_id = 21;
}

message BaselineWindowSample {
  int64 frame_id = 1;
  int64 timestamp_ms = 2;
  bytes raw_frame = 3;
  string edge_prediction_json = 4;
  double confidence = 5;
  double entropy = 6;
  string quality_metadata_json = 7;
  string upload_mode = 8;
  bool is_keyframe = 9;
}

message BaselineWindowRequest {
  string run_id = 1;
  string baseline_method = 2;
  int64 edge_id = 3;
  string model_name = 4;
  string model_version = 5;
  string video_source = 6;
  string window_id = 7;
  int64 window_start_frame_id = 8;
  int64 window_end_frame_id = 9;
  int64 timestamp_ms = 10;
  repeated BaselineWindowSample selected_samples = 11;
  int64 source_window_id = 12;
  int64 source_start_frame_idx = 13;
  int64 source_end_frame_idx = 14;
  int64 source_frame_count = 15;
  int64 uploaded_keyframe_count = 16;
}

message BaselineInferenceRequest {
  string run_id = 1;
  string baseline_method = 2;
  int64 edge_id = 3;
  int64 frame_id = 4;
}

message BaselineInferenceReply {
  bool success = 1;
  string message = 2;
  string run_id = 3;
  string baseline_method = 4;
  int64 edge_id = 5;
  int64 frame_id = 6;
  string cloud_prediction_json = 7;
  double confidence = 8;
  int64 timestamp_ms = 9;
}

message BaselineCommandRequest {
  string run_id = 1;
  string baseline_method = 2;
  int64 edge_id = 3;
  int64 timestamp_ms = 4;
}

message BaselineCommandReply {
  bool success = 1;
  string message = 2;
  repeated string command_json = 3;
}

message EkyaFrameUpload {
  reserved 13;
  string method = 1;
  string run_id = 2;
  int64 edge_id = 3;
  int64 camera_id = 4;
  int64 task_id = 5;
  int64 chunk_id = 6;
  int64 frame_idx = 7;
  string video_name = 8;
  double timestamp_edge_capture = 9;
  double timestamp_edge_send = 10;
  repeated int64 image_shape = 11;
  bytes encoded_frame_jpeg = 12;
}

message EkyaDetectionBox {
  double x1 = 1;
  double y1 = 2;
  double x2 = 3;
  double y2 = 4;
  int64 label = 5;
  double score = 6;
  string class_name = 7;
}

message EkyaDetectionResult {
  string method = 1;
  string run_id = 2;
  int64 edge_id = 3;
  int64 camera_id = 4;
  int64 task_id = 5;
  int64 chunk_id = 6;
  int64 frame_idx = 7;
  string video_name = 8;
  double timestamp_edge_capture = 9;
  double timestamp_edge_send = 10;
  double timestamp_cloud_receive = 11;
  double timestamp_inference_start = 12;
  double timestamp_inference_end = 13;
  double timestamp_cloud_send = 14;
  repeated int64 image_shape = 15;
  repeated EkyaDetectionBox detections = 16;
  string model_version = 17;
  bytes encoded_frame_jpeg = 18;
}

message EkyaDisplayEvent {
  string method = 1;
  string run_id = 2;
  int64 edge_id = 3;
  int64 camera_id = 4;
  int64 task_id = 5;
  int64 chunk_id = 6;
  int64 frame_idx = 7;
  double timestamp_edge_capture = 8;
  double timestamp_edge_send = 9;
  double timestamp_edge_receive = 10;
  double timestamp_edge_display = 11;
  bool displayed = 12;
  string drop_reason = 13;
}

message EkyaStreamClose {
  string run_id = 1;
  int64 edge_id = 2;
}

message EkyaAck {
  bool success = 1;
  string message = 2;
}

message EkyaClientMessage {
  oneof payload {
    EkyaFrameUpload frame_upload = 1;
    EkyaDisplayEvent display_event = 2;
    EkyaStreamClose close = 3;
  }
}

message EkyaServerMessage {
  oneof payload {
    EkyaDetectionResult detection_result = 1;
    EkyaAck ack = 2;
    EkyaAck error = 3;
  }
}

message ExperimentResultArtifact {
  string comparison_id = 1;
  string run_id = 2;
  string method = 3;
  int32 edge_id = 4;
  string relative_path = 5;
  bytes content = 6;
  int64 size_bytes = 7;
  string sha256 = 8;
  string content_type = 9;
  bool is_final = 10;
}

message UploadExperimentResultRequest {
  string comparison_id = 1;
  string run_id = 2;
  string method = 3;
  int32 edge_id = 4;
  repeated ExperimentResultArtifact artifacts = 5;
}

message UploadExperimentResultResponse {
  bool accepted = 1;
  string message = 2;
  repeated string stored_paths = 3;
}
